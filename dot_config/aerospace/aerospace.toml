# AeroSpace Configuration

# General
config-version = 2

after-startup-command = ['layout --workspace 9 --root h_accordion']
start-at-login = true
auto-reload-config = true

# Layout
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'
accordion-padding = 24

# Behavior
automatically-unhide-macos-hidden-apps = false
focus-follows-mouse.enabled = false

# Workspaces
persistent-workspaces = ['1', '2', '3', '4', '5', '7', '8', '9']

# Gaps
gaps.inner.horizontal = 6
gaps.inner.vertical = 6
gaps.outer.left = 6
gaps.outer.bottom = 6
gaps.outer.top = 6
gaps.outer.right = 6

[mode.main.binding]
    # Terminal
    cmd-ctrl-enter = 'exec-and-forget open -a Ghostty'

    # Focus
    cmd-ctrl-h = 'focus left'
    cmd-ctrl-j = 'focus down'
    cmd-ctrl-k = 'focus up'
    cmd-ctrl-l = 'focus right'

    # Move
    ctrl-shift-h = 'move left'
    ctrl-shift-j = 'move down'
    ctrl-shift-k = 'move up'
    ctrl-shift-l = 'move right'

    # Workspaces
    ctrl-0 = 'workspace-back-and-forth'
    ctrl-1 = 'summon-workspace 1'
    ctrl-2 = 'summon-workspace 2'
    ctrl-3 = 'summon-workspace 3'
    ctrl-4 = 'summon-workspace 4'
    ctrl-5 = 'summon-workspace 5'
    ctrl-6 = 'summon-workspace 6'
    ctrl-7 = 'summon-workspace 7'
    ctrl-8 = 'summon-workspace 8'
    ctrl-9 = 'summon-workspace 9'

    # Send
    cmd-ctrl-1 = 'move-node-to-workspace 1'
    cmd-ctrl-2 = 'move-node-to-workspace 2'
    cmd-ctrl-3 = 'move-node-to-workspace 3'
    cmd-ctrl-4 = 'move-node-to-workspace 4'
    cmd-ctrl-5 = 'move-node-to-workspace 5'
    cmd-ctrl-6 = 'move-node-to-workspace 6'
    cmd-ctrl-7 = 'move-node-to-workspace 7'
    cmd-ctrl-8 = 'move-node-to-workspace 8'
    cmd-ctrl-9 = 'move-node-to-workspace 9'

    # Service
    ctrl-semicolon = 'mode service'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'

    shift-h = 'resize width -10'
    shift-j = 'resize height +10'
    shift-k = 'resize height -10'
    shift-l = 'resize width +10'

    minus = 'resize smart -50'
    equal = 'resize smart +50'
    b = 'balance-sizes'
    enter = 'mode main'
    esc = 'mode main'

[mode.service.binding]
    # Layout
    v = 'layout h_tiles'
    s = 'layout v_tiles'
    slash = 'layout tiles horizontal vertical'
    a = 'layout accordion horizontal vertical'
    f = 'fullscreen'
    space = 'layout floating tiling'
    b = 'balance-sizes'

    # Join
    h = 'join-with left'
    j = 'join-with down'
    k = 'join-with up'
    l = 'join-with right'

    # Utility
    m = 'focus-monitor --wrap-around next'
    shift-m = 'move-workspace-to-monitor --wrap-around next'
    r = 'mode resize'
    shift-r = 'reload-config'
    t = 'flatten-workspace-tree'

    esc = 'mode main'

# Apps

# 1: terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = [
    'move-node-to-workspace 1',
    'layout floating',
]


# 2: web
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 2'

# 3: code
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 3'

# 4: agents
[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 4'

# 9: chat
[[on-window-detected]]
if.app-id = 'com.tencent.xinWeChat'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'com.bytedance.macos.feishu'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id = 'now.typeless.desktop'
run = 'move-node-to-workspace 9'

# Floating
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.openvpn.client.app'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'io.github.clash-verge-rev.clash-verge-rev'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bjango.istatmenus'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'io.tailscale.ipn.macsys'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.jetbrains.toolbox'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.logi.ghub'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.logi.optionsplus'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.alienator88.Pearcleaner'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.adguard.safari.AdGuard'
run = 'layout floating'
