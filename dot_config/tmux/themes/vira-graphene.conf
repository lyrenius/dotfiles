# Vira Graphene for tmux. Ghostty owns the terminal background opacity.

set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 240
set -g status-style 'bg=default,fg=#676767'

set -g status-left '#[fg=#BD9855,bold]#{?client_prefix,󰌌 PREFIX ,}#[fg=#343434,nobold]#{?client_prefix,│ ,}#[fg=#6581BD,bold]#{?pane_in_mode,󰆏 COPY ,}#[fg=#343434,nobold]#{?pane_in_mode,│ ,}#[fg=#B2595E,bold]#{?pane_synchronized,󰓦 SYNC ,}#[fg=#343434,nobold]#{?pane_synchronized,│ ,}#[fg=#80CBC4,bold]󰆍 #S #[fg=#343434,nobold]│ #[fg=#676767]󰖲 #{session_windows} #[fg=#343434]│ #[fg=#676767] #{window_panes} '
set -g status-right '#[fg=#6581BD] #{pane_current_command} #[fg=#343434]│ #[fg=#6581BD] #{b:pane_current_path} #[fg=#343434]│ #{cpu_fg_color} #{cpu_percentage} #[fg=#343434]│ #{ram_fg_color}󰍛 #{ram_percentage} #[fg=#343434]│ #[fg=#676767]󰒋 #H #[fg=#343434]│ #[fg=#BD9855]󰃭 %a %b %d #[fg=#343434]│ #[fg=#D9D9D9,bold]󰥔 %H:%M '

setw -g window-status-separator '#[fg=#343434]│'
setw -g window-status-format '#[fg=#545454] #I #[fg=#676767]#W '
setw -g window-status-current-format '#[fg=#80CBC4,bold] 󰖲 #I:#W#{?window_zoomed_flag, 󰊓,} '
setw -g window-status-activity-style 'fg=#BD9855,bg=default,bold'
setw -g window-status-bell-style 'fg=#B2595E,bg=default,bold'

set -g pane-border-style 'fg=#343434,bg=default'
set -g pane-active-border-style 'fg=#80CBC4,bg=default'
set -g pane-border-lines single

set -g mode-style 'fg=#212121,bg=#80CBC4,bold'
set -g message-style 'fg=#D9D9D9,bg=#2B2B2B'
set -g message-command-style 'fg=#D9D9D9,bg=#2B2B2B'
set -g popup-style 'fg=#D9D9D9,bg=#2B2B2B'
set -g popup-border-style 'fg=#80CBC4,bg=#2B2B2B'
set -g popup-border-lines rounded
# Older tmux releases use their native menu colors instead of these options.
set -g -q menu-style 'fg=#D9D9D9,bg=#2B2B2B'
set -g -q menu-selected-style 'fg=#212121,bg=#80CBC4,bold'
set -g clock-mode-colour '#80CBC4'
