# Shared defaults. Override per machine in ~/.config/chezmoi/chezmoi.toml
# under [data.features] and [data.restore].

# Shell configuration is opt-in: each machine enables the shell it uses.
[features]
zsh = false

# Plugin restoration is separate from deploying configuration files.
# These defaults preserve the full development environment on this Mac.
[restore]
tmux = true
yazi = true
neovim = true

# Tool state moved under XDG_DATA_HOME (~/.local/share): variable = directory.
# .zshenv exports every entry for shells.
[toolHomes]
CARGO_HOME = "cargo"
RUSTUP_HOME = "rustup"
GROK_HOME = "grok"
CLAUDE_CONFIG_DIR = "claude"
COPILOT_HOME = "copilot"
CODEX_HOME = "codex"

# Entries of toolHomes that GUI apps on macOS also need. Apps opened from the
# Dock or Spotlight never read .zshenv; the com.lyre.environment LaunchAgent
# sets these for them at login.
[launchd]
env = ["CODEX_HOME"]
